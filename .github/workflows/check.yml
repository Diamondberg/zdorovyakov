name: Project checks
on:
  push:
    branches: [main, feature/zdorovyakov-mvp]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zdorovyakov_test
          POSTGRES_USER: postgres
          # Disposable CI fixture only, never production credentials.
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-ephemeral-only@127.0.0.1:5432/zdorovyakov_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: node --check scripts/audit-local.mjs
      - run: node --check scripts/check-project.mjs
